name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/cujarrett/secret-mirror-controller:main
            ghcr.io/cujarrett/secret-mirror-controller:sha-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The CRD is generated from api/, so the copy ArgoCD applies is written by
      # CI rather than copied by hand - a stale schema in the cluster is silent.
      - name: Push the generated CRD to homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PAT }}
        run: |
          SRC="config/crd/bases/platform.local.lab_secretmirrors.yaml"
          FILE="cluster/secret-mirror-controller/crd.yaml"
          REPO="cujarrett/homelab"

          FILE_SHA=$(gh api /repos/$REPO/contents/$FILE --jq '.sha')
          CURRENT=$(gh api /repos/$REPO/contents/$FILE --jq '.content' | tr -d '\n' | base64 -d)

          if [ "$CURRENT" = "$(cat $SRC)" ]; then
            echo "CRD unchanged"
            exit 0
          fi

          gh api --method PUT /repos/$REPO/contents/$FILE \
            -f message="chore: sync secret-mirror-controller CRD" \
            -f content="$(base64 -w 0 < $SRC)" \
            -f sha="$FILE_SHA"

      - name: Update image tag in homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_PAT }}
        run: |
          FILE="cluster/secret-mirror-controller/deployment.yaml"
          IMAGE="ghcr.io/cujarrett/secret-mirror-controller"
          REPO="cujarrett/homelab"
          SHA_TAG="sha-${GITHUB_SHA}"

          FILE_SHA=$(gh api /repos/$REPO/contents/$FILE --jq '.sha')
          CONTENT=$(gh api /repos/$REPO/contents/$FILE --jq '.content' | tr -d '\n' | base64 -d)
          UPDATED=$(echo "$CONTENT" | sed "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHA_TAG}|")

          gh api --method PUT /repos/$REPO/contents/$FILE \
            -f message="chore: deploy secret-mirror-controller ${SHA_TAG}" \
            -f content="$(echo "$UPDATED" | base64 -w 0)" \
            -f sha="$FILE_SHA"
